[package]
name = "trait-kit-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file = "../LICENSE"
license = "MIT"
description = "Proc-macro crate for trait-kit: #[derive(Module)] generates ModuleMeta declarations."
keywords = ["trait-kit", "derive", "module", "di"]
categories = ["rust-patterns", "development-tools"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
# syn 默认特性 = derive+parsing+printing+clone-impls+proc-macro；这里只声明
# 宏展开实际用到的四个。不启用 clone-impls：本 crate 对 AST 只读不拷贝
# （展开代码里的 `.clone()` 作用于用户字段类型，与 syn 节点的 Clone 无关）。
# 不启用 extra-traits：本 crate 不对 syn AST 做 Debug/Eq 断言，该特性只会给
# 所有下游的宏编译平添 impl 生成成本。不启用 full：三个 derive 只解析
# `DeriveInput` 与 `#[module(...)]`/字段属性（`Expr`/`Type`/`Meta` 在 derive 下
# 即可用），不需要 Item/File 等整树 AST。
syn = { version = "3.0", default-features = false, features = [
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }

[dev-dependencies]
# path-only：publish 时 dev-deps 被剔除、不参与 registry 解析（带 version 会在
# 主包同名版本发布前形成循环解析失败）；本地联调走 path 取主仓工作区码。
# 主包 default 特性为空集，显式关闭仅为声明统一。
trait-kit = { path = "..", default-features = false }
trybuild = { version = "1.0", default-features = false }
