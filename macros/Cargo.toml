[package]
name = "trait-kit-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"
description = "Proc-macro crate for trait-kit: #[derive(Module)] generates ModuleMeta declarations."
keywords = ["trait-kit", "derive", "module", "di"]
categories = ["rust-patterns", "development-tools"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
# syn 默认特性 = derive+parsing+printing+clone-impls+proc-macro，此处显式重申。
# 不启用 extra-traits：本 crate 不对 syn AST 做 Debug/Eq 断言，该特性只会给
# 所有下游的宏编译平添 impl 生成成本。
syn = { version = "3.0", default-features = false, features = [
    "derive",
    "full",
    "parsing",
    "printing",
    "clone-impls",
    "proc-macro",
] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }

[dev-dependencies]
# path-only：publish 时 dev-deps 被剔除、不参与 registry 解析（带 version 会在
# 主包同名版本发布前形成循环解析失败）；本地联调走 path 取主仓工作区码
trait-kit = { path = ".." }
trybuild = { version = "1.0", default-features = false }
