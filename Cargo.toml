[package]
name = "trait-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Module Standard Interface and Capability Management Center — A lightweight Rust library that provides a standard interface for module definition and Kit capability management."
keywords = ["module", "trait", "capability", "kit", "interface"]
categories = ["rust-patterns", "development-tools"]
readme = "README.md"

# docs.rs 文档需覆盖全部 feature 门控 API（本项目无互斥 feature，all-features 安全）。
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[workspace.package]
version = "0.5.0-rc.7"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
repository = "https://github.com/Kirky-X/trait-kit.git"
license = "MIT"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
confers = { version = "0.6.0-rc.6", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
trait-kit = { path = ".", default-features = false }

[dependencies]
confers = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
icu = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
writeable = { version = "0.6", default-features = false, features = ["alloc"], optional = true }
sys-locale = { version = "0.3", default-features = false, optional = true }
# Runtime-agnostic timer for `run_probes_with_timeout` / `probe_aggregate_with_timeout`:
# a global background thread drives the delays, so the futures stay executor-independent
# (no tokio/async-std coupling). Native std backend needs no feature; the wasm
# backends (`gloo-timers`/`wasm-bindgen`/`send_wrapper`) are deliberately not enabled.
futures-timer = { version = "3.0", default-features = false, optional = true }
# Fluent FTL message translation (concurrent bundle). Always on: `tr()` /
# `I18nManager` work with or without the `i18n` feature (en-US fallback).
# 两者默认特性为空集，显式关闭仅作声明（无可裁剪面）。
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
# Structured logging facade for degradation events (`soft_build` fallback
# path, `register_shutdown_into` bridge-failure logging). Always on:
# `soft_build` is ungated public API, so a `dep:log` feature would split the
# API surface for a facade with zero transitive deps. Facade only: records
# surface in whatever subscriber the consumer installs (log-native, or
# bridged by tracing-subscriber's default `tracing-log` support).
log = { version = "0.4", default-features = false, features = ["std"] }
# confers 0.6 起 `derive_field_key` 返回 `Zeroizing<[u8; 32]>`（密钥材料 drop
# 自清零），trait-kit 的 `derive_kit_field_key` 透传该容器，需显式命名类型。
zeroize = { version = "1.9", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
# thiserror 无 std 时走 core::error::Error；serial_test 只用同步 #[serial]，
# 砍掉 logging/async 默认特性携带的 log 与 futures-executor/futures-util
# （env_logger 属非默认的 test_logging 特性，本就不在裁剪面内）。
thiserror = { version = "2.0", default-features = false }
serial_test = { version = "4.0", default-features = false }
static_assertions = { version = "1.1", default-features = false }
trybuild = { version = "1.0", default-features = false }
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# async-trait 无任何 feature，显式关闭仅为声明统一。
async-trait = { version = "0.1", default-features = false }
serde_json = { workspace = true }
trait-kit-macros = { version = "0.5.0-rc.7", path = "macros" }

[[bench]]
name = "kit_bench"
path = "benches/kit_bench.rs"
harness = false
# Toggle benchmarks exercise the `toggle`-gated API surface; plain `cargo bench`
# (default features) skips this target, `cargo bench --features toggle` runs it.
required-features = ["toggle"]

[features]
default = []
# AsyncKit: Send + Sync async capability management (no extra deps, Rust native async).
async = []
# Config integration: Store + ModuleConfig trait, plus re-export of confers'
# `Config` derive macro. The proc-macro crate `trait-kit-macros` is NOT wired
# through this feature — users add `trait-kit-macros` as a direct dependency
# to use its derives (see src/kit/mod.rs).
confers = ["dep:confers", "dep:serde", "dep:serde_json", "confers/feature-toggle"]
# Hot-reload subscription (Kit 自有 SubscriberMap，不再拉入 confers/watch 的 notify-debouncer-full)。
reload = ["confers"]
# Encrypted config storage (maps to confers `encryption` feature).
# 文档声称的三层继承链 `encryption` → `reload` → `confers` 在此定义成立。
encryption = ["reload", "confers", "confers/encryption", "dep:zeroize"]
# Interface/implementation separation: register_as / resolve behind a feature gate.
di = []
# Deprecated alias of `di`.
interface = ["di"]
# Lifecycle hooks: on_ready (post-build) + on_shutdown (cleanup).
lifecycle = []
# Health check: per-module health status reporting.
health = []
# Service probe registry: object-safe async probes (`ServiceProbe`) with
# latency capture, worst-of aggregation and auto-unregister on shutdown.
# Builds on the health feature's `HealthStatus` vocabulary; the async
# registration surface lives on `AsyncKit` (feature `async`).
probe = ["health", "dep:futures-timer"]
# Scoped dependencies: per-request instance isolation.
request-scope = []
# Deprecated alias of `request-scope`.
scope = ["request-scope"]
# Feature toggle: runtime module enable/disable via string-keyed HashMap.
toggle = []
# Build observability: observer callbacks during module construction.
observer = []
# Module decorators: post-build capability wrapping/enhancement.
decorator = []
# Graceful shutdown coordinator: phased shutdown with hook registration + timeout.
shutdown = []
# ICU4X locale-aware formatting (number/date/plural/collation) + system
# locale detection. Fluent message translation (`tr()` / `I18nManager`) is
# feature-independent: without this feature it still works with the en-US
# fallback locale.
i18n = ["dep:icu", "dep:writeable", "dep:sys-locale"]
# Structured build report (build_report JSON), health aggregate JSON export,
# and contract manifest export. Pulls serde + serde_json.
report = ["dep:serde", "dep:serde_json"]
# Preset module packages: ConfersConfigModule (confers ConfigProvider as a Kit
# module) + common composition builder.
presets = ["confers"]
# Sub-Kit composition: register a child Kit as a single parent module
# (namespaced capabilities, cross-Kit dependency validation).
compose = []
# Remote configuration bridge: ConfersConfigModule over confers remote
# AsyncSource. Implies `async` because the remote module is built through
# `AsyncKit::build()` (its previous absence made `presets-remote` alone
# fail to compile with unresolved `AsyncKit` imports).
presets-remote = ["presets", "confers/remote", "async"]
# Capability version negotiation: ModuleMeta::VERSION vs required_versions
# semver-compat validation at build() time.
version-negotiation = []
# Deprecated alias of `version-negotiation`.
negotiate = ["version-negotiation"]

# E2E 测试源文件位于 tests/e2e/（Cargo 不自动发现子目录文件），显式注册：
# 目标二进制名保持 e2e_*（`cargo test --test e2e_core` 等命令不变）；
# i18n zh/en 双文件依赖独立进程隔离（I18nManager 为进程级单例），
# 故不聚合为单 main.rs；文件级 #![cfg] 门控保证任意 feature 组合可编译。
[[test]]
name = "e2e_advanced"
path = "tests/e2e/e2e_advanced.rs"

[[test]]
name = "e2e_async"
path = "tests/e2e/e2e_async.rs"

[[test]]
name = "e2e_concurrency"
path = "tests/e2e/e2e_concurrency.rs"

[[test]]
name = "e2e_config"
path = "tests/e2e/e2e_config.rs"

[[test]]
name = "e2e_core"
path = "tests/e2e/e2e_core.rs"

[[test]]
name = "e2e_encryption"
path = "tests/e2e/e2e_encryption.rs"

[[test]]
name = "e2e_feature_combinations"
path = "tests/e2e/e2e_feature_combinations.rs"

[[test]]
name = "e2e_features"
path = "tests/e2e/e2e_features.rs"

[[test]]
name = "e2e_hooks"
path = "tests/e2e/e2e_hooks.rs"

[[test]]
name = "e2e_i18n"
path = "tests/e2e/e2e_i18n.rs"

[[test]]
name = "e2e_i18n_en"
path = "tests/e2e/e2e_i18n_en.rs"

[[test]]
name = "e2e_presets"
path = "tests/e2e/e2e_presets.rs"

[[test]]
name = "e2e_runtime"
path = "tests/e2e/e2e_runtime.rs"

[workspace]
resolver = "2"
members = [".", "examples", "macros"]
default-members = ["."]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
