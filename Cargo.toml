[package]
name = "trait-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Module Standard Interface and Capability Management Center — A lightweight Rust library that provides a standard interface for module definition and Kit capability management."
keywords = ["module", "trait", "capability", "kit", "interface"]
categories = ["rust-patterns", "development-tools"]
readme = "README.md"

# docs.rs 文档需覆盖全部 feature 门控 API（本项目无互斥 feature，all-features 安全）。
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[workspace.package]
version = "0.5.0-rc.5"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky.X"]
repository = "https://github.com/Kirky-X/trait-kit.git"
license = "MIT"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
confers = { version = "0.6.0-rc.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trait-kit = { path = ".", default-features = false }

[dependencies]
confers = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
icu = { version = "2.3", optional = true }
writeable = { version = "0.6", optional = true }
sys-locale = { version = "0.3", optional = true }

[dev-dependencies]
thiserror = { version = "2.0", default-features = false }
serial_test = "4.0"
static_assertions = "1.1"
trybuild = "1.0"
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
async-trait = "0.1"
serde_json = { workspace = true }
trait-kit-macros = { version = "0.5.0-rc.5", path = "trait-kit-macros" }

[[bench]]
name = "kit_bench"
path = "benches/kit_bench.rs"
harness = false
# Toggle benchmarks exercise the `toggle`-gated API surface; plain `cargo bench`
# (default features) skips this target, `cargo bench --features toggle` runs it.
required-features = ["toggle"]

[features]
default = []
# AsyncKit: Send + Sync async capability management (no extra deps, Rust native async).
async = []
# Config integration: Store + ModuleConfig trait, plus re-export of confers'
# `Config` derive macro. The proc-macro crate `trait-kit-macros` is NOT wired
# through this feature — users add `trait-kit-macros` as a direct dependency
# to use its derives (see src/kit/mod.rs).
confers = ["dep:confers", "dep:serde", "dep:serde_json", "confers/feature-toggle"]
# Hot-reload subscription (Kit 自有 SubscriberMap，不再拉入 confers/watch 的 notify-debouncer-full)。
reload = ["confers"]
# Encrypted config storage (maps to confers `encryption` feature).
# 文档声称的三层继承链 `encryption` → `reload` → `confers` 在此定义成立。
encryption = ["reload", "confers", "confers/encryption"]
# Interface/implementation separation: register_as / resolve behind a feature gate.
di = []
# Deprecated alias of `di`.
interface = ["di"]
# Lifecycle hooks: on_ready (post-build) + on_shutdown (cleanup).
lifecycle = []
# Health check: per-module health status reporting.
health = []
# Scoped dependencies: per-request instance isolation.
request-scope = []
# Deprecated alias of `request-scope`.
scope = ["request-scope"]
# Feature toggle: runtime module enable/disable via string-keyed HashMap.
toggle = []
# Build observability: observer callbacks during module construction.
observer = []
# Module decorators: post-build capability wrapping/enhancement.
decorator = []
# Graceful shutdown coordinator: phased shutdown with hook registration + timeout.
shutdown = []
# ICU4X locale-aware formatting (number/date/plural/collation).
# Without this feature, `tr()` and `I18nManager` still work (lightweight FTL translation).
i18n = ["dep:icu", "dep:writeable", "dep:sys-locale"]
# Structured build report (build_report JSON), health aggregate JSON export,
# and contract manifest export. Pulls serde + serde_json.
report = ["dep:serde", "dep:serde_json"]
# Preset module packages: ConfersConfigModule (confers ConfigProvider as a Kit
# module) + common composition builder.
presets = ["confers"]
# Sub-Kit composition: register a child Kit as a single parent module
# (namespaced capabilities, cross-Kit dependency validation).
compose = []
# Remote configuration bridge: ConfersConfigModule over confers remote
# AsyncSource (AsyncKit only; pulls confers/remote).
presets-remote = ["presets", "confers/remote"]
# Capability version negotiation: ModuleMeta::VERSION vs required_versions
# semver-compat validation at build() time.
version-negotiation = []
# Deprecated alias of `version-negotiation`.
negotiate = ["version-negotiation"]

# E2E 测试源文件位于 tests/e2e/（Cargo 不自动发现子目录文件），显式注册：
# 目标二进制名保持 e2e_*（`cargo test --test e2e_core` 等命令不变）；
# i18n zh/en 双文件依赖独立进程隔离（I18nManager 为进程级单例），
# 故不聚合为单 main.rs；文件级 #![cfg] 门控保证任意 feature 组合可编译。
[[test]]
name = "e2e_advanced"
path = "tests/e2e/e2e_advanced.rs"

[[test]]
name = "e2e_async"
path = "tests/e2e/e2e_async.rs"

[[test]]
name = "e2e_concurrency"
path = "tests/e2e/e2e_concurrency.rs"

[[test]]
name = "e2e_config"
path = "tests/e2e/e2e_config.rs"

[[test]]
name = "e2e_core"
path = "tests/e2e/e2e_core.rs"

[[test]]
name = "e2e_encryption"
path = "tests/e2e/e2e_encryption.rs"

[[test]]
name = "e2e_feature_combinations"
path = "tests/e2e/e2e_feature_combinations.rs"

[[test]]
name = "e2e_features"
path = "tests/e2e/e2e_features.rs"

[[test]]
name = "e2e_hooks"
path = "tests/e2e/e2e_hooks.rs"

[[test]]
name = "e2e_i18n"
path = "tests/e2e/e2e_i18n.rs"

[[test]]
name = "e2e_i18n_en"
path = "tests/e2e/e2e_i18n_en.rs"

[[test]]
name = "e2e_presets"
path = "tests/e2e/e2e_presets.rs"

[[test]]
name = "e2e_runtime"
path = "tests/e2e/e2e_runtime.rs"

[workspace]
resolver = "2"
members = [".", "examples", "trait-kit-macros"]
default-members = ["."]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

