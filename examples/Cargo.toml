[package]
name = "trait-kit-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
trait-kit = { workspace = true }
# serde + confers are direct deps because #[derive(Config)] expands to code that
# references confers::* / serde::* paths from the *caller's* crate.
serde = { workspace = true, optional = true }
confers = { workspace = true, optional = true }

[features]
default = []
confers = ["dep:confers", "dep:serde", "trait-kit/confers"]
reload = ["confers", "trait-kit/reload"]
encryption = ["reload", "trait-kit/encryption"]
async = ["trait-kit/async"]
lifecycle = ["trait-kit/lifecycle"]
health = ["trait-kit/health"]
observer = ["trait-kit/observer"]
scope = ["trait-kit/scope"]
toggle = ["trait-kit/toggle"]
decorator = ["trait-kit/decorator"]
interface = ["trait-kit/interface"]
shutdown = ["trait-kit/shutdown"]
i18n = ["trait-kit/i18n"]

[[example]]
name = "default_basic"
path = "src/core/default_basic.rs"

[[example]]
name = "confers_loader"
path = "src/kit/confers_loader.rs"
required-features = ["confers"]

[[example]]
name = "confers_macros"
path = "src/kit/confers_macros.rs"
required-features = ["confers"]

[[example]]
name = "hot_reload"
path = "src/kit/hot_reload.rs"
required-features = ["reload"]

[[example]]
name = "encryption"
path = "src/kit/encryption.rs"
required-features = ["encryption"]

[[example]]
name = "async_basic"
path = "src/kit/async_basic.rs"
required-features = ["async"]

[[example]]
name = "lifecycle"
path = "src/core/lifecycle.rs"
required-features = ["lifecycle"]

[[example]]
name = "health_check"
path = "src/core/health_check.rs"
