[[example]]
name = "observability"
path = "src/core/observability.rs"
required-features = ["observer"]

[[example]]
name = "scope_basic"
path = "src/kit/scope_basic.rs"
required-features = ["scope"]

[[example]]
name = "conditional"
path = "src/kit/conditional.rs"

[[example]]
name = "factory"
path = "src/kit/factory.rs"

[[example]]
name = "decorator"
path = "src/kit/decorator.rs"
required-features = ["decorator"]

[[example]]
name = "interface"
path = "src/core/interface.rs"
required-features = ["interface"]

[[example]]
name = "i18n"
path = "src/i18n/i18n.rs"
