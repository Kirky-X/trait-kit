# cargo-deny 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# `cargo deny check` 校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/
# 仓库特有豁免写在 [advisories].ignore 与 [[licenses.exceptions]],须附原因注释。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# 按仓库填:传递依赖 RUSTSEC 豁免(每项须注释原因)。
# 本仓当前依赖树无 RUSTSEC 命中(历史豁免 RUSTSEC-2024-0436 paste、
# RUSTSEC-2026-0173 proc-macro-error2 对应的 crate 已不在树中,
# 保留条目会触发 cargo-deny advisory-not-detected 告警,故移除;
# 若未来传递依赖重新引入,请在此恢复并附原因注释)。

[licenses]
# 允许的宽松许可证;新增非宽松许可证需在此放行
# (按本仓依赖图实际命中的许可证精简,未命中项保留会产生
# unused-allowed-license 告警)
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8
unused-allowed-license = "warn"
# 7 仓统一 license：MIT + Commons Clause v1.0（license-file 形态，见 base/CONFIG_BASELINE.md）。
# cargo-deny 不识别 manifest 的 license-file 且 allow 不接受 LicenseRef-*，
# 对本地工作区 crate 用 clarify 绑定 LICENSE 文件内容 hash（防篡改）并按文件内
# MIT 主文识别放行；Commons Clause 商用限制由 LICENSE 文件本身承载

[[licenses.clarify]]
name = "trait-kit"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xfb13e7ad }]
[[licenses.clarify]]
name = "trait-kit-derive"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0xfb13e7ad }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
name = "serde_yaml" # deprecated, use serde_yaml_ng
wrappers = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
