# feature 组合矩阵（feature imply 裂缝的回归门禁）。
# PR 每次都跑 22 个单开 check 成本过高，故此处仅定时/手动触发；
# 单开裂缝在 PR 门禁之外由 src/kit/presets.rs 的 compile_error 守卫兜底
# （presets-remote→async 链）。
name: feature-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # 每周一 05:23 UTC

permissions:
  contents: read

concurrency:
  group: feature-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  each-feature:
    name: cargo hack --each-feature
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Install cargo-hack
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-hack
      - name: Check each feature alone
        run: cargo hack check --each-feature

  powerset-depth2:
    name: cargo hack --feature-powerset --depth 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Install cargo-hack
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-hack
      - name: Check feature pairs
        run: cargo hack check --feature-powerset --depth 2
