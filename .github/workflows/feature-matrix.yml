# feature 组合矩阵（feature imply 裂缝的回归门禁）。
# PR 每次都跑 22 个单开 check 成本过高，故此处仅定时/手动触发；
# 单开裂缝在 PR 门禁之外由 src/kit/presets.rs 的 compile_error 守卫兜底
# （presets-remote→async 链）。
name: feature-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # 每周一 05:23 UTC

permissions:
  contents: read

concurrency:
  group: feature-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  each-feature:
    name: cargo hack --each-feature
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-hack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hack
      - name: Check each feature alone
        run: cargo hack check --each-feature

  powerset-depth2:
    name: cargo hack --feature-powerset --depth 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-hack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hack
      - name: Check feature pairs
        run: cargo hack check --feature-powerset --depth 2
