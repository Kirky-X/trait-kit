name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - name: Verify build (all features)
        run: cargo build --release --all-features
      - name: Verify tests pass
        run: cargo test --all-features --no-fail-fast

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # semver 预发布段（-rc.N 等）→ GitHub prerelease 标记；rc 不得抢占 Latest
      - name: Derive prerelease flag
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release uniqueness (idempotency guard)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "release objects for ${TAG}: ${COUNT}"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT}; release state is not idempotent"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io (conditional)
    needs: github-release
    runs-on: ubuntu-latest
    # crates.io trusted publishing（OIDC）：id-token: write 必需，
    # auth-action 以 Actions OIDC 换取短时凭证，长生命周期令牌退役
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      HAS_CRATES_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'

      - name: Check already published
        id: published
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          CODE_M=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
            "https://crates.io/api/v1/crates/trait-kit-macros/${VERSION}")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
            "https://crates.io/api/v1/crates/trait-kit/${VERSION}")
          echo "crates.io: trait-kit=$CODE trait-kit-macros=$CODE_M for $VERSION"
          echo "macros_exists=$([[ "$CODE_M" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "main_exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth
      - name: Publish trait-kit-macros (依赖,必须先于主 crate)
        if: env.HAS_CARGO_TOKEN == 'true' && steps.published.outputs.macros_exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        working-directory: macros
        run: cargo publish
        # 本地/重跑路径已发布时撞车属幂等成功，不阻断 Release 交付
        continue-on-error: true

      - name: Wait for crates.io index
        if: env.HAS_CARGO_TOKEN == 'true'
        run: sleep 30

      - name: Publish trait-kit (cargo token)
        if: env.HAS_CARGO_TOKEN == 'true' && steps.published.outputs.main_exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --all-features
        # 本地/重跑路径已发布时撞车属幂等成功，不阻断 Release 交付
        continue-on-error: true

      - name: Publish trait-kit (crates.io token)
        if: env.HAS_CARGO_TOKEN != 'true' && env.HAS_CRATES_TOKEN == 'true' && steps.published.outputs.main_exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --all-features
        # 本地/重跑路径已发布时撞车属幂等成功，不阻断 Release 交付
        continue-on-error: true

      # 发布步骤带 continue-on-error(幂等重跑),但版本最终必须可查——
      # 否则此处硬失败,防止"绿色 Release 实际没发出去"的静默漏发。
      # 校验版本取自 Cargo.toml workspace.version(publish 的就是它,
      # 对 tag push 与 workflow_dispatch 同样成立),不取 tag 名以免
      # 手动触发时 tag 缺失。无任何 registry token 时本就不发布,整体跳过。
      - name: Verify on crates.io
        if: always() && (env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 Cargo.toml 提取 workspace.version,校验中止"
            exit 1
          fi
          echo "Verifying trait-kit + trait-kit-macros ${VERSION} on crates.io"
          for crate in trait-kit trait-kit-macros; do
            ok=""
            for i in 1 2 3 4 5; do
              sleep 20
              # crates.io API 必须带 User-Agent,否则 403
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
                "https://crates.io/api/v1/crates/${crate}/${VERSION}")
              echo "try$i ${crate}: HTTP ${CODE}"
              if [ "$CODE" = "200" ]; then ok=1; break; fi
              if [ "$CODE" != "403" ]; then break; fi
            done
            if [ -z "$ok" ]; then
              echo "::error::${crate} ${VERSION} 未出现在 crates.io(HTTP ${CODE})"
              exit 1
            fi
          done
