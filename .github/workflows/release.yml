name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Verify build (all features)
        run: cargo build --release --all-features
      - name: Verify tests pass
        run: cargo test --all-features --no-fail-fast

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io (conditional)
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      HAS_CRATES_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'

      - name: Publish trait-kit-macros (依赖,必须先于主 crate)
        if: env.HAS_CARGO_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: trait-kit-macros
        run: cargo publish
        # 本地/重跑路径已发布时撞车属幂等成功，不阻断 Release 交付
        continue-on-error: true

      - name: Wait for crates.io index
        if: env.HAS_CARGO_TOKEN == 'true'
        run: sleep 30

      - name: Publish trait-kit (cargo token)
        if: env.HAS_CARGO_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --all-features
        # 本地/重跑路径已发布时撞车属幂等成功，不阻断 Release 交付
        continue-on-error: true

      - name: Publish trait-kit (crates.io token)
        if: env.HAS_CARGO_TOKEN != 'true' && env.HAS_CRATES_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --all-features
        # 本地/重跑路径已发布时撞车属幂等成功，不阻断 Release 交付
        continue-on-error: true

      # 发布步骤带 continue-on-error(幂等重跑),但版本最终必须可查——
      # 否则此处硬失败,防止"绿色 Release 实际没发出去"的静默漏发。
      - name: Verify on crates.io
        if: always()
        run: |
          sleep 15
          for crate in trait-kit trait-kit-macros; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/${crate}/0.5.0-rc.6")
            echo "${crate}: HTTP ${CODE}"
            if [ "$CODE" != "200" ]; then
              echo "::error::${crate} 0.5.0-rc.6 未出现在 crates.io"
              exit 1
            fi
          done
